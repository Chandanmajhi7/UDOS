# LOCAL VERIFICATION ONLY. Production does not run Postgres in the cluster — it
# uses a managed instance (RDS/Cloud SQL, Architecture §9's pool/silo clusters)
# provisioned by Terraform (infra/terraform), which is also where the real
# udos_app/udos_platform_admin credentials come from (a secrets manager, not a
# committed file). This manifest exists so `kind` has something to actually boot
# apps/api against when proving the Kubernetes topology works end to end.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: udos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: udos_superuser
            - name: POSTGRES_PASSWORD
              value: dev_only_cluster_postgres
            - name: POSTGRES_DB
              value: udos
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ['pg_isready', '-U', 'udos_superuser']
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: udos
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
