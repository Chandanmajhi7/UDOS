# LOCAL VERIFICATION ONLY — plaintext Secret manifest with dev credentials
# checked into git on purpose (they're the same "dev_only_*" passwords the RLS
# migration itself creates, apps/api's own .env.example, meaningless outside a
# throwaway kind cluster). Production NEVER does this: real credentials come from
# a secrets manager (AWS Secrets Manager / GCP Secret Manager) synced into the
# cluster via External Secrets Operator, referenced by name — see
# infra/terraform's notes and docs/phase-11-cloud-deployment.md §4.
apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: udos
type: Opaque
stringData:
  DATABASE_URL: 'postgresql://udos_app:dev_only_udos_app@postgres.udos.svc.cluster.local:5432/udos?schema=public'
  PLATFORM_DATABASE_URL: 'postgresql://udos_platform_admin:dev_only_udos_platform_admin@postgres.udos.svc.cluster.local:5432/udos?schema=public'
  MIGRATION_DATABASE_URL: 'postgresql://udos_superuser:dev_only_cluster_postgres@postgres.udos.svc.cluster.local:5432/udos?schema=public'
